lcoy-roselle:
  admin:
    settings:
      group_appearance: 外观
      group_list: 讨论列表
      group_topic: 讨论
      group_community: 社区
      group_composer: 编辑器与搜索
      section_colors: 颜色
      colors_help: 本主题没有自己的配色：整套调色板都来自 Flarum 的主色，就像 Discourse 的 Horizon 主题使用其第三色一样。淡色背景、选中态、链接和聚焦环都由它派生，浅色和深色模式均如此。
      colors_link: 在「外观」中修改颜色
      section_font: 字体
      font_label: 论坛字体
      font_help: 整个论坛使用的字体。Inter 和 Plus Jakarta Sans 随主题提供，覆盖拉丁字母；系统字体不下载任何文件，覆盖所有文字。
      font_inter: Inter：主题默认
      font_jakarta: Plus Jakarta Sans
      font_system: 系统字体
      font_notice: 更改字体会重新编译论坛 CSS，因此保存需要几秒钟。
      section_surfaces: 背景与卡片
      tinted_background_label: 背景使用主色淡化
      tinted_background_help: 内容和侧栏后面的背景会带上一抹主色，如同 Horizon。关闭后，背景保持中性灰色。
      content_card_label: 内容置于卡片内
      content_card_help: 列表、讨论和个人主页置于背景之上的圆角卡片中。关闭后，内容会占满整个区域，没有边框。
      pill_buttons_label: 胶囊按钮
      pill_buttons_help: 两端完全圆润的按钮，如同 Horizon。关闭后，按钮使用略微圆角。
      show_title_with_logo_label: 在徽标旁显示论坛标题
      show_title_with_logo_help: 在「外观」中上传徽标后，只有开启此项，标题才会显示在徽标旁。没有徽标时，标题始终显示。
      section_sidebar: 侧栏
      sidebar_enabled_help: 包含导航和标签的左栏，如同 Discourse。关闭后，论坛会恢复 Flarum 的默认导航。
      sidebar_open_default_label: 默认展开
      sidebar_open_default_help: 对于尚未用页头按钮打开或关闭过侧栏的人，侧栏的显示方式。之后各访客的选择优先，并保存在其浏览器中。
      sidebar_new_topic_label: 「发起讨论」按钮
      sidebar_new_topic_help: 侧栏顶部的按钮，会打开编辑器以发起新讨论。
      sidebar_footer_label: 侧栏页脚
      sidebar_footer_help: 侧栏底部的按钮：浅色或深色主题、新讨论和键盘快捷键。
      section_sidebar_tags: 标签
      sidebar_categories_label: 标签区域
      sidebar_categories_help: 主标签，每个带有自己的颜色或图标，以及指向全部标签的链接。
      sidebar_tags_label: 二级标签区域
      sidebar_tags_help: 二级标签，以及指向全部标签的链接。
      sidebar_tags_limit_label: 侧栏中的二级标签
      sidebar_tags_limit_help: 在「全部标签」链接之前列出多少个二级标签，从 {min} 到 {max}。
      section_header_search: 页头搜索
      header_search_help: 页头中间的胶囊形搜索框，如同 Discourse。关闭后，页头恢复 Flarum 的默认搜索。
      section_shortcuts: 键盘快捷键
      keyboard_shortcuts_help: Discourse 的快捷键：/ 搜索，c 新讨论，r 回复，j 和 k 在列表中移动，g h 返回首页，= 打开或关闭侧栏，? 显示完整列表。在输入框中输入时它们不会生效。
      section_welcome_banner: 欢迎横幅
      welcome_banner_help: 「外观」中设置的欢迎标题和消息会以横幅形式显示在淡色背景之上，如同 Horizon。关闭后，页面直接从列表开始。
      welcome_banner_guests_only_label: 仅访客
      welcome_banner_guests_only_help: 已登录成员会直接进入列表；横幅面向首次访问的访客。
      welcome_banner_search_label: 横幅中的搜索框
      welcome_banner_search_help: 横幅中间的大号搜索框，会打开论坛搜索。
      section_category_hero: 标签页头
      category_hero_help: 在标签页面中，列表之前显示一个包含图标、颜色、名称和描述的页头。
      category_hero_children_label: 子标签以卡片显示
      category_hero_children_help: 页头下方，子标签以可点击的卡片形式显示。
      section_nav: 列表标签页
      nav_unread_label: 未读标签页
      nav_unread_help: 包含某人尚未阅读的回复的讨论。仅对已登录成员显示。
      nav_hot_label: 热门标签页
      nav_hot_help: 最近几天发起的讨论中回复最多的那些。
      hot_days_label: 热门的统计天数
      hot_days_help: 统计的时间范围，从 {min} 到 {max} 天。
      section_nav_categories: 标签筛选
      nav_dropdowns_label: 标签菜单
      nav_dropdowns_help: 标签页左侧的菜单，用于按主标签和二级标签筛选列表，如同 Discourse。
      nav_categories_link_label: 「标签」标签页
      nav_categories_link_help: 指向包含全部标签页面的标签页。
      section_list_columns: 列表列
      list_header_label: 列标题
      list_header_help: 列表上方包含「讨论」「回复」「浏览」和「活动」的那一行。
      list_posters_label: 参与者的头像
      list_posters_help: 每条讨论旁显示作者和最后回复者的头像，类似 Discourse 的发帖人列。
      list_views_label: 浏览列
      list_views_help: 每条讨论被浏览的次数，由 fof/discussion-views 统计。未启用该扩展时不会显示这一列。
      list_heat_label: 高数值高亮
      list_heat_help: 当数值远高于其它时，将其显示为橙色或红色，类似 Discourse 的热力图。
      list_excerpts_label: 置顶讨论的摘要
      list_excerpts_help: 标题下方显示置顶讨论第一条帖子的开头。
      section_categories_page: 标签页面
      categories_layout_label: 布局
      categories_layout_help: 全部标签页面展示标签的方式。
      categories_layout_boxes: 盒子：带有颜色、描述和子标签的卡片
      categories_layout_list: 列表：标签及其最新讨论的表格
      section_topic_map: 讨论信息
      topic_map_help: 首帖下方显示包含创建日期、最后回复、回复数量和参与者的摘要。
      section_topic_timeline: 时间线
      topic_timeline_help: 右侧的进度条，显示你在讨论中的位置，并可跳转到任意帖子。
      section_topic_footer: 讨论页脚
      topic_footer_help: 最后一条帖子之后显示回复、分享和关注，如同 Discourse。关注需要 Subscriptions 扩展。
      section_suggested: 推荐讨论
      suggested_topics_help: 讨论末尾显示一个简短的其他讨论列表，方便继续阅读，优先来自同一标签。
      suggested_count_label: 讨论数量
      suggested_count_help: 推荐多少个讨论，从 {min} 到 {max}。
      section_user_page: 个人主页
      user_cover_label: 个人主页顶部的封面
      user_cover_help: 大头像和用户名后面的宽幅背景，如同 Discourse。
      user_stats_label: 统计
      user_stats_help: 用户名下方显示加入日期、最后访问时间以及帖子和讨论数量。只有启用 Likes 扩展时才显示赞。
      user_summary_label: 摘要标签页
      user_summary_help: 第一个标签页，显示该用户的各项数据及其主要讨论和回复。
      user_activity_read_label: 已读标签页
      user_activity_read_help: 在「活动」下，显示某人已读的讨论，按时间从新到旧排列。仅本人和管理员可见。
      user_activity_reactions_label: 表情回应标签页
      user_activity_reactions_help: 在「活动」下，将该用户给出的赞和表情回应合并为一个列表（取代 Likes），并显示表情和帖子摘要。只有有权查看回应者身份的人才能看到这些表情回应。
      user_activity_votes_label: 投票标签页
      user_activity_votes_help: 在「活动」下，显示某人参与投票的带投票帖。其他人只能看到公开投票者的投票。
      user_activity_solved_label: 已解决标签页
      user_activity_solved_help: 在「活动」下，显示该用户被选为最佳答案的回复。
      section_user_card: 用户卡片
      user_card_help: 一个简洁的卡片，包含头像、数据和主页链接，可由他人的头像或用户名打开，无需离开当前页面。
      groups_aria: 设置分组
      search_placeholder: 搜索设置…
      search_clear: 清除搜索
      search_empty: 未找到设置。
      palette_accent: 强调色
      palette_background: 淡色背景
      palette_selected: 选中色
      palette_accent_low: 柔和强调色
      palette_ring: 聚焦环
      palette_link: 链接
      colors_current: 当前主色
      palette_light: 浅色
      palette_dark: 深色
      shell:
        group_navigation: 页头与侧栏
        group_people: 个人主页与用户
        group_moderation: 审核
        group_integrations: 集成
        more_groups: 更多设置
        fewer_groups: 收起设置
        group_appearance_desc: 颜色、字体、表面、按钮、图标与提示条。
        group_navigation_desc: 页头搜索与菜单、登录、键盘快捷键，以及 Discourse 风格的侧栏。
        group_list_desc: 讨论列表的首页、选项卡、列、标签与计数。
        group_topic_desc: 帖子、时间线、主题信息、页脚与阅读功能。
        group_composer_desc: Discourse 风格的编辑器、草稿、#标签与高级搜索。
        group_people_desc: 个人主页、用户卡片、扩展字段与活动。
        group_community_desc: 关于、社区准则、用户与用户组。
        group_moderation_desc: 管理工具：批量操作与给作者的提示。
        group_integrations_desc: 为第三方扩展套用 Discourse 外观。每项都只有在启用对应扩展后才会生效。
        'on': 开启
        'off': 关闭
        locked: 不可用
        saved: 已保存
        saving: 正在保存…
        saved_all: 更改已保存
        save_error: 无法保存
        autosave: 所有设置都会自动保存
        requires_extension: 需要 {name} 扩展
        extension_disabled: 需要 {name} 扩展，该扩展已安装但未启用。
        extension_missing: 需要 {name} 扩展，但该扩展尚未安装。
        open_extension: 打开该扩展
        depends_on: 依赖于「{name}」，而它当前已关闭。
        go_enable: 前往开启
        hidden_title: 因依赖的项目已关闭而被隐藏
        needs: 需要「{name}」
        active_count: '{active} 项功能已开启，共 {total} 项'
        search_results: 「{query}」的搜索结果
        auth_backend_off: 服务器尚未加载 /login 和 /signup 页面（extend/auth.php），因此按钮仍会打开弹窗。
      loading_slider_label: 顶部的加载条
      loading_slider_help: 切换页面时，屏幕顶部会有一条细进度条一直显示到页面加载完成，如同 Discourse，取代 Flarum 的「正在加载…」提示。
      loader:
        title: 加载动画
        preview_save: 保存
        help: 内容加载时显示的动画：出现在列表、帖子、个人主页、弹窗、菜单、按钮、编辑器、扩展以及页面首次加载时。可以用动画 SVG 替换 Flarum 原来的灰色转圈图标。
        style_label: 样式
        style_default: Flarum 默认
        style_avocado: 牛油果
        style_orbital: 环绕
        style_ring: Discourse 圆环
        style_dots: 圆点
        style_bars: 条形
        style_pulse: 脉冲
        style_custom: 自定义 SVG
        custom_label: SVG 代码
        custom_help: 粘贴动画 SVG 的代码，或上传 .svg 文件（最大 64 KB）。保存前会在服务器上清理：脚本、事件和外部链接都会被移除，CSS 和 SMIL 动画则保留。
        custom_upload: 上传 SVG 文件
        custom_apply: 应用 SVG
        custom_clear: 移除
        custom_too_big: 文件超过 64 KB。
        custom_not_svg: 该文件看起来不是 SVG。
        custom_empty: 请粘贴或上传 SVG 以使用此样式。在此之前，论坛仍会使用 Flarum 的转圈图标。
        tint_label: 使用指示器颜色着色
        tint_help: SVG 会只保留形状，并用下面的颜色着色（在按钮中则使用文字颜色）。关闭后，文件保留自身的颜色。
        color_label: 颜色
        color_help: 未选择颜色时，使用主题的强调色（即主色，在标签页上则为标签颜色）。在按钮中，指示器会跟随按钮文字的颜色。
        color_primary: 使用主题颜色
        size_label: 大小
        size_help: 相对 Flarum 转圈图标的大小，可选 {min}% 到 {max}%。在按钮中，指示器会跟随文字大小。
        preview: 预览
        notice: 更换加载动画会重新编译论坛 CSS，保存需要几秒钟。
      toast_auto_close_label: 自动关闭的提示条
      toast_auto_close_help: 角落提示（「已保存」「链接已复制」等）会在几秒后自动消失，并显示倒计时条，类似 Discourse 的提示条。关闭后，它们会一直保留直到被关闭。
      user_menu_label: Discourse 用户菜单
      user_menu_help: 页头头像会打开一个面板，其中包含通知、回复、赞、私信、收藏、审核和个人主页等标签页（取代 Flarum 的铃铛和会话菜单）。
      nav_sticky_label: 吸顶标签页
      nav_sticky_help: 滚动列表时，标签栏会吸在页头下方，如同 Horizon。meta.discourse.org 不吸顶。
      list_infinite_scroll_label: 无限滚动
      list_infinite_scroll_help: 当列表末尾接近屏幕时，下一页会自动加载，如同 Discourse。关闭后，仍保留 Flarum 的「加载更多」按钮。
      post_actions_label: Discourse 帖子操作
      post_actions_help: 在每条帖子的操作栏中显示赞、复制链接、收藏、回复，以及展开其余操作的「…」，如同 Discourse。关闭后，会恢复 Flarum 的操作菜单。
      embedded_replies_label: 内嵌回复
      embedded_replies_help: 每条帖子的「N 条回复」会在其下方打开回复，被引用的帖子会显示在上方，如同 Discourse。
      post_style_label: 帖子样式
      post_style_help: 使用时间线时，帖子与 Discourse 保持一致，但会有一条类似 avocado 主题的竖线，把一条帖子的头像连接到下一条，穿过事件通知，并用圆圈标记时间间隔（「一个月后」）。平板宽度及以上生效；手机上帖子保持原样。
      post_style_discourse: Discourse（默认）
      post_style_direct: 使用时间线（avocado 风格）
      topic_reply_to_style_label: 帖子上的「回复」标识
      topic_reply_to_style_help: 用于设置回复他人的帖子如何显示它回复的对象。在 Discourse 中，页头右侧显示「↩ 名称」（仅在所回复的帖子不是其上方那条时）。在 avocado 中，每条回复的用户名下方都有一行「↳ 回复 [头像] 名称」。点击可查看被回复的帖子。
      topic_reply_to_style_discourse: Discourse（默认：页头右侧的 ↩ 名称）
      topic_reply_to_style_avocado: 用户名下方的一行（avocado 风格）
      new_replies_bar_label: 新回复提示
      new_replies_bar_help: 当实时回复到达时，正在浏览该讨论的人会看到「有 N 条新回复」提示条，点击即可前往，如同 Discourse。
      content_width_label: 内容宽度
      content_width_default: 默认
      content_width_wide: 宽
      content_width_wider: 超宽
      content_width_90: 90%
      content_width_full: 全宽
      content_width_custom: 自定义
      content_width_help: 内容卡片（列表、讨论、个人主页）的最大宽度；在讨论中，帖子列会随之一同变宽。默认值为 1110px，与 Discourse 相同；90% 和全宽会跟随屏幕。预览按 {width}px 屏幕展示真实论坛。
      content_width_caption: '{width}px 屏幕'
      content_width_preview_index: 首页
      content_width_preview_discussion: 讨论
      topic_sticky_avatar_label: 帖子中的吸顶头像
      topic_sticky_avatar_help: 在长帖子中，作者头像会跟随滚动并保持可见，直到帖子结束，类似 avocado 主题。仅桌面端。
      topic_event_posts_label: 事件帖
      topic_event_posts_help: 在讨论中显示 Flarum 的通知，例如「锁定了讨论」和「置顶了讨论」。Discourse 不会这样显示。
      community:
        section_legal_links: 条款与隐私
        view_page: 在论坛中查看该页面
        section_about: 关于页面
        about_enabled_help: 类似 Discourse 的页面，包含论坛简介、自定义文本、联系方式、管理团队和站点数据。会在侧栏的「更多」菜单中添加一个链接。
        about_text_label: 关于文本
        about_text_help: 显示在标题下方。支持 Markdown 和 BBCode（以论坛已启用的为准）；如果文本包含 HTML 标签，则按 HTML 原样使用，不做格式化。
        about_contact_email_label: 联系邮箱
        about_contact_email_help: 显示在「联系我们」框中。此邮箱是公开的：请使用管理团队的邮箱。
        about_contact_url_label: 联系页面
        about_contact_url_help: 联系表单或联系页面的完整地址（https://…）。
        about_show_staff_label: 显示管理团队
        about_show_staff_help: 「我们的管理员」和「我们的版主」列表。隐藏的用户组对看不到它们的人不予显示。
        about_show_stats_label: 显示站点统计
        about_show_stats_help: 最近 24 小时、7 天、30 天以及全部时间内的讨论、帖子、注册、活跃用户和赞。
        stats_notice: 这些数字只统计公开内容，每 30 分钟重新计算一次。
        guidelines_enabled_label: 社区守则页面（/guidelines）
        guidelines_enabled_help: 论坛的社区规则，显示在「关于」旁的标签页和侧栏的「更多」菜单中。/faq 同样指向该页面，与 Discourse 一致。
        guidelines_page_label: fof/pages 页面
        guidelines_page_none: 无：使用下方文本
        guidelines_page_help: 选定页面后，/guidelines 会显示该页面的内容（遵循 fof/pages 自身的可见性设置），下方文本不再生效。之后在 fof/pages 中编辑该内容。
        guidelines_page_create: 用当前文本创建「社区守则」页面
        guidelines_text_label: 社区守则文本
        guidelines_text_help: 留空则使用主题的默认文本，灵感来自 Discourse 的社区守则。支持 Markdown 和 BBCode；包含 HTML 标签时按 HTML 处理。
        section_about_pages: 关于区域页面
        about_pages_help: 可任意添加 fof/pages 页面，作为「关于」和「社区守则」旁的标签页，每个页面都采用规则页布局：标题、章节索引和卡片。
        about_pages_list_help: 每个页面会按列表顺序成为「关于」和「社区守则」之后的标签页，地址为 /about/id-slug，布局与社区守则一致。标签留空则使用页面标题；图标为 Font Awesome 类名。fof/pages 中隐藏或受限的页面只对能看到它们的人显示。
        about_pages_add: 添加页面…
        about_pages_none_left: 所有 fof/pages 页面都已在此列表中
        about_pages_missing: '页面 #{id}（未找到）'
        about_pages_label: 标签文本
        about_pages_icon: 图标（可选）
        about_pages_up: 上移
        about_pages_down: 下移
        about_pages_remove: 从关于区域中移除
        tos_url_label: 服务条款地址
        tos_url_help: 「服务条款」标签页和 /tos 都指向这里。名称中包含「terms」的 FoF Terms 政策优先。
        privacy_url_label: 隐私政策地址
        privacy_url_help: 「隐私政策」标签页和 /privacy 都指向这里。名称中包含「privacy」的 FoF Terms 政策优先。
        legal_notice: 如果未设置地址（此处或 FoF Terms 中），该标签页不会显示。其他 FoF Terms 政策会以自己的名称成为标签页。
        directory_guests_label: 游客也能查看成员
        directory_guests_help: 默认情况下，只有拥有「查看用户列表」权限（在权限中设置）的人才能看到用户组成员。开启后，游客也能看到，但私密论坛除外。
        section_groups: 用户组
        groups_enabled_help: 每个用户组一张卡片，显示其图标、颜色和成员数，并为每个组提供展示成员的页面。隐藏的用户组只对能看到它们的人显示。
        groups_activity_label: 活动标签页
        groups_activity_help: 成员在用户组页面上的近期帖子。
        groups_profile_links_label: 个人主页上的用户组链接到用户组页面
        groups_profile_links_help: 个人主页卡片上的用户组胶囊按钮会变成指向 /g/group-name 的链接。
      gaps:
        notifications_title: 给作者的提示
        mention_cards_help: 点击 @提及会打开用户卡片，而不是跳转到个人主页。
        sidebar_category_dots_label: 标签上的新动态圆点
        sidebar_category_dots_help: 有新帖或未读讨论的标签旁会有一个圆点，和「全部讨论」上的一样。
        timeline_back_label: 时间线上的「返回」按钮
        timeline_back_help: 当读者滚到已读位置上方很远时，时间线轨道上会出现一个按钮，点它回到最后未读的帖子。
        mention_cards_label: 提及时的用户卡片
        backend_off: 这些功能的后端（extend/gaps.php）还没有在服务器上加载。
        cooked_title: 帖子内容
        tables_notice: Markdown 表格（| a | b |），同 Discourse：请在 FoF Formatting 里开启 PipeTables。
        reading_title: 讨论内的阅读与跳转
        inline_title_editor_label: 在页头直接改标题
        inline_title_editor_help: 有重命名权限的人会在讨论标题旁看到一个铅笔图标：标题变成输入框，并带有标签按钮和 ✓/✕ 用于保存或取消。
        share_modal_label: 「分享讨论」弹窗
        share_modal_help: 点击「分享」会打开 Discourse 风格的弹窗，包含链接、复制按钮和各平台按钮；关闭后仅复制链接。手机上使用系统分享面板。
        local_dates_label: 本地时间
        local_dates_help: '[date=2026-10-20 time=14:00 timezone="America/Sao_Paulo"] 会按读者的时区显示日期和时间。清理缓存后生效。'
        not_found_page_label: Discourse 风格的 404 页面
        not_found_page_help: 用「糟糕！该页面不存在或为私密页面。」，以及「返回首页」、搜索框和热门/最新讨论，替代简单的错误页面。
        list_title: 上次访问与忽略
        sidebar_home_link_label: 「首页」链接
        sidebar_home_link_help: 侧栏的第一个链接，与 Discourse 一致。当它指向讨论列表时，「全部讨论」会改为打开「最新」列表，以免两者同时被标记。
        sidebar_home_label: 目标页面
        sidebar_home_index: 讨论列表（首页）
        sidebar_home_categories: 标签
        sidebar_home_url_option: 其它地址
        sidebar_title: 额外链接
        sidebar_help: 和 Discourse 一样，填了地址的 FAQ、服务条款和隐私链接会进入「更多」菜单。「审核」只对版主显示，带着举报队列。
        code_buttons_label: 代码块按钮
        code_buttons_help: 鼠标悬停在代码块上时显示「复制」和「全屏」，与 Discourse 一致。
        heading_anchors_label: 标题链接
        heading_anchors_help: 帖子内的标题在悬停时出现链接图标（#），可直接定位到该段落。
        table_expand_label: 展开宽表格
        table_expand_help: 超出帖子宽度的表格会出现「展开表格」按钮，在独立大窗口中打开。
        spoiler_blur_label: 模糊剧透
        spoiler_blur_help: 剧透内容（||文本|| 和行首的 >!）在点击前保持模糊，与 Discourse 一致，而不是显示深色遮罩。
        post_read_state_label: 已读标记
        post_read_state_help: 每条新帖子角落的「未读」圆点，读过后消失；上次阅读位置之后还会显示红色的「上次访问」分隔线。
        post_shortcuts_label: 帖子快捷键
        post_shortcuts_help: j/k 在帖子间移动，l、b、s、e、r、q、d、! 作用于当前选中的帖子；# 跳转到指定帖子；Home/End、shift+L、shift+R、shift+S、shift+P、f、m w/m r/m m 以及 g n、g u、g b、g m、g d、g j、g k 等组合键；按 ? 可查看完整列表。
        share_networks_label: 分享平台
        share_networks_help: 用逗号分隔，按显示顺序排列：x、facebook、linkedin、whatsapp、telegram、reddit、email。
        notify_post_edited_label: 帖子被编辑时通知
        notify_post_edited_help: 当其他人（例如管理人员）修改正文时，向作者发送「某某编辑了你的帖子」。
        notify_topic_linked_label: 讨论被链接时通知
        notify_topic_linked_help: 当某个帖子链接到你的讨论时，发送「某某链接了你的讨论」。
        list_last_visit_label: 「上次访问」分隔线
        list_last_visit_help: 在「最新」列表中，用一条红线把上次访问后发生变化的话题与之前已如此的区分开。上次访问时间保存在读者设备上。
        list_dismiss_label: 「忽略」按钮
        list_dismiss_help: 在「未读」和「新」列表中，Discourse 风格的按钮可将列表中的话题全部标记为已读（右上角及列表末尾）。
        sidebar_home_url_label: 首页地址
        sidebar_home_url_help: 论坛内地址（如 /p/welcome）或其他网站的地址。
        sidebar_faq_url_label: FAQ / 社区准则
        sidebar_faq_url_help: 常见问题或社区准则页面的地址。
        sidebar_tos_url_label: 服务条款
        sidebar_tos_url_help: 服务条款的地址。
        sidebar_privacy_url_label: 隐私政策
        sidebar_privacy_url_help: 隐私政策的地址。
        sidebar_custom_title_label: 自定义分区标题
        sidebar_custom_title_help: 链接分区的名称（默认「链接」）。
        sidebar_custom_links_label: 自定义分区链接
        sidebar_custom_links_help: 每行一个链接：名称 | 地址 | 图标（可选，Font Awesome 图标）。以 / 开头的地址指向本站。没有链接时该分区不显示。
      integrations:
        solved_label: 已采纳的解决方案
        solved_help: 帖子操作栏中的「✓ 解决方案」，以及首帖正下方的已采纳回答，效果与 discourse-solved 一致。
        reactions_label: 表情回应
        reactions_help: 帖子操作栏中的表情汇总，效果与 discourse-reactions 一致。
        polls_label: 投票
        polls_help: 采用 Discourse 投票栅格样式的投票：结果条，以及旁边醒目的大号票数。
        links_sidebar_label: 侧栏中的链接
        links_sidebar_help: FoF Links 从页头移到侧栏的一个区块中，类似 Discourse 的自定义链接。
        upload_progress_label: 上传进度
        upload_progress_help: 通过 FoF Upload 发送文件时，编辑器中显示的「正在上传…」进度条，与 Discourse 一致。
        profile_cover_label: 个人主页封面（forumaker/profile-cover）
        profile_cover_help: 用该扩展的封面取代主题自带的封面：显示在个人主页的横幅中、用户卡片后方（有缩略图时则作为缩略图），以及在其编辑器中选定的位置——该编辑器可从个人主页的「…」菜单和「设置」中打开。主题自带的图片仍会保留，关闭此开关后即可恢复使用。
        thumbnails_label: 列表中的缩略图
        thumbnails_help: 在讨论列表中于标题旁显示 FoF Discussion Thumbnail 的图片，也就是 Discourse 显示自带缩略图的位置。
      auth:
        pages_label: 整页登录和注册
        pages_help: 页头的「登录」和「注册」按钮会像 Discourse 那样打开 /login 和 /signup 页面。关闭后，它们会打开弹窗。
      bookmarks:
        title: 收藏
        bookmarks_enabled_help: 成员可以收藏帖子，以便之后回看，并可添加可选的名称和提醒，在个人主页的「收藏」标签页中可以找到全部收藏。关闭后，相关按钮会消失，接口的行为就像该功能不存在一样，已有收藏会保留。
        bookmarks_topic_button_label: 收藏讨论
        bookmarks_topic_button_help: 在讨论操作菜单（页脚的「…」菜单）中添加「收藏讨论」。它会像 Discourse 那样收藏第一条帖子。
        bookmarks_user_menu_label: 用户菜单项
        bookmarks_user_menu_help: 在头像菜单中，「个人主页」的下方新增一个「收藏」快捷入口。
        reminders_notice: 提醒由 Flarum 的计划任务每五分钟发送一次，服务器必须通过 cron 每分钟执行 php flarum schedule:run。没有 cron 时，收藏仍可正常使用，但不会发送提醒。
      composer:
        section_editor: Discourse 编辑器
        enabled_help: 总开关：关闭后，编辑器回到 Flarum 原版，不启用下面任何功能。
        preview_label: 并排预览
        preview_help: 在桌面端，格式化后的帖子会显示在编辑器右侧。任何人都可以用编辑器角落的 « 按钮将其隐藏。
        similar_label: 相似讨论
        similar_help: 撰写新讨论标题时（三个词以上），会显示「你的讨论与以下内容相似…」，最多列出五条相关讨论。
        linked_topic_label: 将回复作为关联讨论
        linked_topic_help: 在回复编辑器中，「↩ ▾」菜单会把这条回复变成一个带有相同内容、指回原讨论的链接以及相同标签的新讨论。
        section_drafts: 草稿
        drafts_help: 安装 FoF Drafts 扩展后，主题会以 Discourse 的方式显示草稿：新讨论和回复在停止输入两秒后自动保存，回复讨论时会恢复它的草稿，带内容关闭时会询问是放弃还是保留，而「发起讨论」按钮会多出一个带列表的 ⌄。草稿也会出现在用户菜单和个人主页的「草稿」标签页中。
        drafts_note: 草稿由 fof/drafts 保存（drafts 表），权限和定时保存也由它负责。编辑帖子没有草稿。
        section_hashtags: '#tag'
        hashtags_help: '在编辑器中输入 # 会提示标签并插入指向它们的链接；在帖子中，这些链接（以及 Mentions 扩展的标签提及）会变成带标签图标的胶囊。'
        hashtags_mentions_notice: '启用 Mentions 扩展后，编辑器中的 # 归它所有（标签提及）；主题只负责把提及绘制成 Discourse 风格的话题标签。'
      extras:
        search_title: 搜索页
        search_page_enabled_help: Discourse 的 /search 页面：讨论、帖子、标签和用户等标签页，高级筛选（作者、主标签、标签、仅标题、已赞、状态、日期、最少帖子数）以及排序。搜索弹窗中会多出一个「高级搜索」链接。
        search_notice: 这些筛选项也会成为可在搜索框中直接输入的快捷方式：in:title、in:likes、in:bookmarks 和 min-posts:5，与 Flarum 自带的（author:、tag:、is:locked…）并列。
        bulk_title: 批量选择
        bulk_select_enabled_help: 列表工具栏中的一个按钮会打开每个讨论上的复选框和一个操作栏：标记为已读、置顶、关闭、更改标签、隐藏和删除。该按钮只会对能管理列表中某些讨论的人显示，且每个操作只在其拥有权限的范围内生效。
        top_periods_title: 按时段排行
        top_periods_enabled_help: 「最佳」标签页显示「全部时间 / 年 / 季度 / 月 / 周 / 今天」，把列表限制在该时段内创建的讨论。
        text_size_title: 文字大小
        text_size_enabled_help: 在「设置」中，每个人可以选择较小、正常、较大或最大。与 Discourse 一样，该选择只对当前设备生效（保存在浏览器中）。
        print_title: 打印讨论
        print_topic_enabled_help: 将全部帖子加载到一个简洁的视图中（不含侧栏、页头和时间线），并打开浏览器的打印对话框，也可用于另存为 PDF。
      lucide_icons_label: Discourse 图标（Lucide）
      lucide_icons_help: 用 Lucide 细线描边绘制的界面图标（搜索、铃铛、回复、赞、菜单等），与 meta.discourse.org 一致。关闭后，会恢复 Font Awesome 的实心图标。Meta 未替换的图标（品牌图标以及部分为标签和用户组选用的图标）仍保留在 Font Awesome 中。
      stats:
        section_views: 浏览列高亮
        stats_views_enabled_help: 列表「浏览」列的高亮颜色（Discourse 的热力图）。浏览数字本身来自 fof/discussion-views。
        topic_views_heat_low_label: 轻度高亮起始值
        topic_views_heat_low_help: 浏览数超过该值后，浏览数字段会略微高亮。Discourse 使用 1000。
        topic_views_heat_medium_label: 中度高亮起始值
        topic_views_heat_medium_help: 浏览数超过该值后，浏览数字段会中度高亮。Discourse 使用 2000。
        topic_views_heat_high_label: 强烈高亮起始值
        topic_views_heat_high_help: 浏览数超过该值后，浏览数字段会强烈高亮。Discourse 使用 3500。
        views_suffix: 次浏览
        section_counts: 新讨论与未读计数
        stats_counts_enabled_help: 对已登录用户：列表标签页上显示「新 (3)」和「未读 (2)」，侧栏中「全部讨论」旁在有新内容时显示小圆点。
        stats_new_days_label: 讨论保持为新帖的天数
        stats_new_days_help: 指在该时段内创建、且本人尚未打开过的讨论。设为 0 时，统计自注册或上次「全部标记为已读」以来的全部内容。可选 {min} 到 {max}；Discourse 使用 2。
        days_suffix: 天
        section_activity: 个人主页活动
        stats_activity_enabled_help: 个人主页摘要中显示访问天数、阅读时长（总计及近 60 天）、已读帖子，以及给出和收到的赞，与 Discourse 一致。
        activity_notice: 阅读时长只在标签页可见且有人在操作页面时才会计时。各项数据自开启该功能之日起从零开始。
      section_colored: 彩色高亮
      colored_accents_help: 在标签页或讨论中，主题的强调色（按钮、链接、当前标签、浅色背景）会变成该标签的颜色；其它页面恢复论坛的主色。
      user_default_tab_label: 打开个人主页时
      user_default_tab_help: 点击头像或昵称时，个人主页默认打开哪个标签页。
      user_default_tab_activity: 活动（帖子），同 Flarum
      user_default_tab_summary: 概要，同 Discourse
