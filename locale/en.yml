lcoy-roselle:
  admin:
    settings:
      group_appearance: Appearance
      group_list: Discussion list
      group_topic: Discussion
      group_community: Community
      group_composer: Composer and search
      section_colors: Colors
      colors_help: 'The theme has no colors of its own: the whole palette comes from Flarum’s primary color, the way Discourse’s Horizon theme does with its tertiary color. The tinted background, selection, links and focus ring are all derived from it, in light and dark mode.'
      colors_link: Change the color in Appearance
      section_font: Font
      font_label: Forum font
      font_help: The typeface used across the whole forum. Inter and Plus Jakarta Sans ship with the theme and cover Latin scripts; the system font downloads nothing and covers every script.
      font_inter: 'Inter: theme default'
      font_jakarta: Plus Jakarta Sans
      font_system: System font
      font_notice: Changing the font recompiles the forum CSS, so saving takes a few seconds.
      section_surfaces: Background & card
      tinted_background_label: Background tinted with the primary color
      tinted_background_help: The background behind the content and the sidebar gets a light touch of the primary color, as in Horizon. Off, it stays a neutral grey.
      content_card_label: Content inside a card
      content_card_help: The list, the discussion and the profile sit on a rounded card over the background. Off, the content fills the whole area with no frame.
      pill_buttons_label: Pill buttons
      pill_buttons_help: Buttons with fully rounded ends, as in Horizon. Off, they get slightly rounded corners.
      show_title_with_logo_label: Show the forum title next to the logo
      show_title_with_logo_help: With a logo uploaded in Appearance, the title only shows next to it when this is on. Without a logo, the title always shows.
      section_sidebar: Sidebar
      sidebar_enabled_help: The left column with the navigation and tags, as in Discourse. Off, the forum goes back to Flarum’s default navigation.
      sidebar_open_default_label: Start open
      sidebar_open_default_help: How the sidebar looks for anyone who has not opened or closed it with the header button yet. After that, each visitor’s choice wins, kept in their browser.
      sidebar_new_topic_label: '"Start a Discussion" button'
      sidebar_new_topic_help: The button at the top of the sidebar that opens the composer for a new discussion.
      sidebar_footer_label: Sidebar footer
      sidebar_footer_help: 'The buttons at the bottom of the sidebar: light or dark theme, new discussion and keyboard shortcuts.'
      section_sidebar_tags: Tags
      sidebar_categories_label: Tags section
      sidebar_categories_help: The primary tags, each with its color or icon, plus the link to all tags.
      sidebar_tags_label: Secondary tags section
      sidebar_tags_help: The secondary tags, plus the link to all tags.
      sidebar_tags_limit_label: Secondary tags in the sidebar
      sidebar_tags_limit_help: How many secondary tags to list before the "All tags" link, from {min} to {max}.
      section_header_search: Header search
      header_search_help: The search pill in the middle of the header, as in Discourse. Off, the header goes back to Flarum’s default search.
      section_shortcuts: Keyboard shortcuts
      keyboard_shortcuts_help: 'The Discourse shortcuts: / search, c new discussion, r reply, j and k move through the list, g h goes home, = opens or closes the sidebar and ? shows the full list. They do nothing while typing in a field.'
      section_welcome_banner: Welcome banner
      welcome_banner_help: The welcome title and message from Appearance in a banner over the tinted background, as in Horizon. Off, the page starts straight at the list.
      welcome_banner_guests_only_label: Guests only
      welcome_banner_guests_only_help: Logged-in members go straight to the list; the banner is for first-time visitors.
      welcome_banner_search_label: Search field in the banner
      welcome_banner_search_help: A large search field in the middle of the banner that opens the forum search.
      section_category_hero: Tag header
      category_hero_help: On a tag page, a header with its icon, color, name and description before the list.
      category_hero_children_label: Child tags as cards
      category_hero_children_help: Below the header, the child tags show up as clickable cards.
      section_nav: List tabs
      nav_unread_label: Unread tab
      nav_unread_help: Discussions with replies the person has not read yet. Only shown to logged-in members.
      nav_hot_label: Hot tab
      nav_hot_help: The discussions with the most replies among those started in the last few days.
      hot_days_label: Days counted in Hot
      hot_days_help: The period considered, from {min} to {max} days.
      section_nav_categories: Tag filters
      nav_dropdowns_label: Tag menus
      nav_dropdowns_help: The menus to the left of the tabs, to filter the list by primary tag and by secondary tag, as in Discourse.
      nav_categories_link_label: Tags tab
      nav_categories_link_help: A tab leading to the page with all tags.
      section_list_columns: List columns
      list_header_label: Column header
      list_header_help: The row with Discussion, Replies, Views and Activity above the list.
      list_posters_label: Avatars of who took part
      list_posters_help: The avatars of the author and of the last person to reply next to each discussion, like the Discourse posters column.
      list_views_label: Views column
      list_views_help: How many times each discussion was viewed, counted by fof/discussion-views. Without the extension the column does not appear.
      list_heat_label: Highlight high counts
      list_heat_help: Paints the counts orange or red when they are well above the rest, like the Discourse heatmap.
      list_excerpts_label: Excerpt of pinned discussions
      list_excerpts_help: Below the title, the start of the first post of pinned discussions.
      section_categories_page: Tags page
      categories_layout_label: Layout
      categories_layout_help: How the page with all tags presents them.
      categories_layout_boxes: 'Boxes: cards with the color, description and child tags'
      categories_layout_list: 'List: a table of tags with their latest discussions'
      section_topic_map: Discussion map
      topic_map_help: Below the first post, a summary with the creation date, the last reply, the number of replies and who took part.
      section_topic_timeline: Timeline
      topic_timeline_help: The bar on the right that shows where you are in the discussion and jumps to any of its posts.
      section_topic_footer: Discussion footer
      topic_footer_help: Reply, share and follow after the last post, as in Discourse. Follow needs the Subscriptions extension.
      section_suggested: Suggested discussions
      suggested_topics_help: At the end of the discussion, a short list of other discussions to keep reading, preferably from the same tag.
      suggested_count_label: Number of discussions
      suggested_count_help: How many discussions to suggest, from {min} to {max}.
      section_user_page: Profile page
      user_cover_label: Cover at the top of the profile
      user_cover_help: A wide band behind the large avatar and the name, as in Discourse.
      user_stats_label: Stats
      user_stats_help: Join date, last visit and post and discussion counts below the name. Likes only show with the Likes extension.
      user_summary_label: Summary tab
      user_summary_help: A first tab with the user’s numbers and their top discussions and replies.
      user_activity_read_label: Read tab
      user_activity_read_help: Under Activity, the discussions the person has read, most recent first. Only the person and administrators can see it.
      user_activity_reactions_label: Reactions tab
      user_activity_reactions_help: Under Activity, the likes and reactions the person has given in a single list, replacing Likes, with the emoji and an excerpt of the post. Reactions are only shown to those allowed to see who reacted.
      user_activity_votes_label: Votes tab
      user_activity_votes_help: Under Activity, the posts with polls the person has voted in. Others only see polls that show their voters.
      user_activity_solved_label: Solved tab
      user_activity_solved_help: 'Under Activity, the person''s replies chosen as best answer.'
      section_user_card: User card
      user_card_help: A compact card with the photo, the numbers and the profile link, opened from someone’s avatar or name without leaving the page.
      groups_aria: Settings groups
      search_placeholder: Search settings…
      search_clear: Clear search
      search_empty: No settings found.
      palette_accent: Accent
      palette_background: Tinted background
      palette_selected: Selection
      palette_accent_low: Soft accent
      palette_ring: Focus ring
      palette_link: Link
      colors_current: Current primary color
      palette_light: Light
      palette_dark: Dark
      shell:
        group_navigation: Header and sidebar
        group_people: Profile and users
        group_moderation: Moderation
        group_integrations: Integrations
        more_groups: More settings
        fewer_groups: Fewer settings
        group_appearance_desc: Colors, font, surfaces, buttons, icons and toasts.
        group_navigation_desc: Header search and menu, log in, keyboard shortcuts and the Discourse sidebar.
        group_list_desc: The home page, tabs, columns, tags and counters of the discussion list.
        group_topic_desc: Posts, timeline, discussion map, footer and reading features.
        group_composer_desc: The Discourse composer, drafts, hashtags and advanced search.
        group_people_desc: Profile page, user card, extra fields and activity.
        group_community_desc: About, guidelines, users and groups.
        group_moderation_desc: 'Staff tools: bulk actions and notices to the author.'
        group_integrations_desc: The Discourse look for third-party extensions. Each one only works with its extension enabled.
        'on': 'On'
        'off': 'Off'
        locked: Unavailable
        saved: Saved
        saving: Saving…
        saved_all: Changes saved
        save_error: Could not save
        autosave: Everything saves automatically
        requires_extension: Requires the {name} extension
        extension_disabled: Requires the {name} extension, which is installed but disabled.
        extension_missing: Requires the {name} extension, which is not installed.
        open_extension: Open the extension
        depends_on: Depends on "{name}", which is off.
        go_enable: Go there
        hidden_title: Hidden because they depend on something that is off
        needs: needs "{name}"
        active_count: '{active} of {total} features on'
        search_results: Results for "{query}"
        auth_backend_off: 'The /login and /signup pages (extend/auth.php) are not loaded on the server yet: the buttons keep opening the modals.'
      loading_slider_label: Loading bar at the top
      loading_slider_help: When changing pages, a thin bar runs along the top of the screen until the page arrives, as in Discourse, instead of Flarum's "Loading…" alert.
      loader:
        title: Loading indicator
        preview_save: Save
        help: "What shows while something loads: in the list, posts, profile, modals, menus, buttons, composer, extensions and the first page load. Swap Flarum's grey ring for an animated SVG."
        style_label: Design
        style_default: Flarum default
        style_avocado: Avocado
        style_orbital: Orbital
        style_ring: Discourse ring
        style_dots: Dots
        style_bars: Bars
        style_pulse: Pulse
        style_custom: Custom SVG
        custom_label: SVG code
        custom_help: "Paste the code of an animated SVG or upload an .svg file (up to 64 KB). It is cleaned on the server before saving: scripts, events and external links are removed; CSS and SMIL animations stay."
        custom_upload: Upload SVG file
        custom_apply: Apply SVG
        custom_clear: Remove
        custom_too_big: The file is larger than 64 KB.
        custom_not_svg: The file does not look like an SVG.
        custom_empty: Paste or upload an SVG to use this design. Until then, the forum keeps Flarum's spinner.
        tint_label: Paint with the indicator color
        tint_help: The SVG becomes just a shape, painted with the color below (or the text color, in buttons). Off, the file keeps its own colors.
        color_label: Color
        color_help: With no color chosen, the theme accent is used (the primary color, or the tag color on tag pages). In buttons the indicator follows the button text color.
        color_primary: Use the theme color
        size_label: Size
        size_help: "Relative to Flarum's spinner, from {min}% to {max}%. In buttons the indicator follows the text."
        preview: Preview
        notice: Changing the indicator recompiles the forum CSS; saving takes a few seconds.
      toast_auto_close_label: Toasts that close on their own
      toast_auto_close_help: Corner notices ("Saved", "Link copied"…) disappear after a few seconds, with a timer bar, like Discourse toasts. When off, they stay until closed.
      user_menu_label: Discourse user menu
      user_menu_help: The header avatar opens the panel with tabs for notifications, replies, likes, messages, bookmarks, review and profile (instead of Flarum's bell and session menu).
      nav_sticky_label: Sticky tabs
      nav_sticky_help: While scrolling the list, the tab bar sticks below the header, as in Horizon. meta.discourse.org does not stick.
      list_infinite_scroll_label: Infinite scroll
      list_infinite_scroll_help: The next page of the list loads by itself when the end gets close to the screen, as in Discourse. When off, Flarum's "Load more" button stays.
      post_actions_label: Discourse post actions
      post_actions_help: Like, copy link, bookmark, reply and the "…" that expands the rest, in each post's bar, as in Discourse. When off, Flarum's controls menu comes back.
      embedded_replies_label: Embedded replies
      embedded_replies_help: Each post's "N replies" opens the replies right below it, and the quoted post shows above, as in Discourse.
      post_style_label: Post style
      post_style_help: 'With the timeline, posts stay the same as in Discourse, but a vertical line, like the avocado theme''s, links one post''s avatar to the next, runs through the event notices and marks the time gaps ("a month later") with a circle. From tablet width up; on phones the post stays the same.'
      post_style_discourse: Discourse (default)
      post_style_direct: With the timeline (avocado style)
      topic_reply_to_style_label: '"In reply to" on posts'
      topic_reply_to_style_help: 'How a post that replies to another shows who it replies to. In Discourse, "↩ Name" on the right of the header (only when the replied post is not the one above). In avocado, a line under the name, "↳ In reply to [avatar] Name", on every reply. Clicking shows the replied post.'
      topic_reply_to_style_discourse: 'Discourse (default: ↩ name on the right of the header)'
      topic_reply_to_style_avocado: Line under the name (avocado style)
      new_replies_bar_label: New replies notice
      new_replies_bar_help: Whoever is in the middle of a discussion when real-time replies arrive sees the "There are N new replies" bar, which takes them there, as in Discourse.
      content_width_label: 'Content width'
      content_width_default: 'Default'
      content_width_wide: 'Wide'
      content_width_wider: 'Extra wide'
      content_width_90: '90%'
      content_width_full: 'Full width'
      content_width_custom: 'Custom'
      content_width_help: 'The maximum width of the content card (list, discussion, profile); in discussions, the posts column grows with it. The default is 1110px, like Discourse; 90% and Full width follow the screen. The preview shows the real forum on a {width}px screen.'
      content_width_caption: '{width}px screen'
      content_width_preview_index: 'Home'
      content_width_preview_discussion: 'Discussion'
      topic_sticky_avatar_label: Sticky avatar in posts
      topic_sticky_avatar_help: 'In long posts, the author avatar follows the scroll and stays visible until the end of the post, like in the avocado theme. Desktop only.'
      topic_event_posts_label: Event posts
      topic_event_posts_help: Show Flarum's notices such as "locked the discussion" and "pinned the discussion" in the discussion. Discourse does not show them this way.
      community:
        section_legal_links: Terms and privacy
        view_page: View the page on the forum
        section_about: About page
        about_enabled_help: Discourse's page with the forum description, your own text, contact details, the staff and the site's numbers. Adds a link to the sidebar's "More" menu.
        about_text_label: About text
        about_text_help: Shown below the title. Supports Markdown and BBCode (whichever the forum has enabled); if the text contains HTML tags, it is used as HTML, unformatted.
        about_contact_email_label: Contact email
        about_contact_email_help: 'Shown in the "Contact us" box. It is public: use a staff address.'
        about_contact_url_label: Contact page
        about_contact_url_help: A full address (https://…) to a contact form or page.
        about_show_staff_label: Show the staff
        about_show_staff_help: The "Our admins" and "Our moderators" lists. Hidden groups are left out for anyone who can't see them.
        about_show_stats_label: Show site statistics
        about_show_stats_help: Discussions, posts, sign-ups, active users and likes in the last 24 hours, 7 days, 30 days and all time.
        stats_notice: The numbers only count public content and are recalculated every 30 minutes.
        guidelines_enabled_label: Guidelines page (/guidelines)
        guidelines_enabled_help: The forum's community rules, in a tab next to About and in the sidebar "More" menu. /faq leads to the same page, as in Discourse.
        guidelines_page_label: fof/pages page
        guidelines_page_none: "None: use the text below"
        guidelines_page_help: With a page chosen, /guidelines shows its content (with fof/pages own visibility) and the text below no longer applies. The content is then edited in fof/pages.
        guidelines_page_create: 'Create the "Guidelines" page with the current text'
        guidelines_text_label: Guidelines text
        guidelines_text_help: Leave empty to use the theme's default text, inspired by Discourse's guidelines. Accepts Markdown and BBCode; with HTML tags, it goes as HTML.
        section_about_pages: About area pages
        about_pages_help: 'Add as many fof/pages pages as you like as tabs next to About and Guidelines, each one with the rules layout: title, section index and cards.'
        about_pages_list_help: Each page becomes a tab after About and Guidelines, in list order, at /about/id-slug and with the same layout as the Guidelines. An empty label uses the page title; the icon is a Font Awesome class. Hidden or restricted pages in fof/pages only show to people who can see them.
        about_pages_add: Add a page…
        about_pages_none_left: Every fof/pages page is already on the list
        about_pages_missing: 'Page #{id} (not found)'
        about_pages_label: Tab label
        about_pages_icon: Icon (optional)
        about_pages_up: Move up
        about_pages_down: Move down
        about_pages_remove: Remove from the About area
        tos_url_label: Terms of Service address
        tos_url_help: The "Terms of Service" tab and /tos lead here. A FoF Terms policy with "terms" in its name takes precedence.
        privacy_url_label: Privacy Policy address
        privacy_url_help: The "Privacy Policy" tab and /privacy lead here. A FoF Terms policy with "privacy" in its name takes precedence.
        legal_notice: Without an address (here or in FoF Terms), the tab doesn't show. Other FoF Terms policies become tabs with their own names.
        directory_guests_label: Guests can see the members too
        directory_guests_help: By default, only those with the "View user list" permission (in Permissions) see group members. When on, guests can see them too, except on a private forum.
        section_groups: Groups
        groups_enabled_help: One card per group, with its icon, color and member count, and a page for each with its members. Hidden groups only appear to those who can see them.
        groups_activity_label: Activity tab
        groups_activity_help: Members' recent posts on the group page.
        groups_profile_links_label: Profile groups link to the group page
        groups_profile_links_help: The group pills on the profile card become links to /g/group-name.
      gaps:
        notifications_title: Notices to the author
        mention_cards_help: Clicking an @mention opens the user card instead of going to the profile.
        sidebar_category_dots_label: New-activity dot on tags
        sidebar_category_dots_help: A dot next to each tag that has new or unread discussions, like the one on “All Discussions”.
        timeline_back_label: “Back” button on the timeline
        timeline_back_help: Anyone who scrolls far above the last post they read sees, on the timeline rail, the button that takes them back to the last unread post.
        mention_cards_label: User card on mentions
        backend_off: The backend for these features (extend/gaps.php) is not loaded on the server yet.
        cooked_title: Post content
        tables_notice: 'Markdown tables (| a | b |), as in Discourse: turn on PipeTables in FoF Formatting.'
        reading_title: Reading and navigating a discussion
        inline_title_editor_label: Edit the title in the header
        inline_title_editor_help: "Anyone who can rename sees a pencil next to the discussion title: the title becomes a field, with the tag button and ✓/✕ to save or cancel."
        share_modal_label: “Share discussion” modal
        share_modal_help: "The Share button opens the Discourse dialog with the link, the copy button and the network buttons. Off, it just copies the link. On mobile, the system share sheet is used."
        local_dates_label: Local dates
        local_dates_help: '[date=2026-10-20 time=14:00 timezone="America/Sao_Paulo"] shows the date and time in the reader''s timezone. Applies after clearing the cache.'
        not_found_page_label: Discourse-style 404 page
        not_found_page_help: '“Oops! That page doesn’t exist or is private.”, with “Back to home”, search and the popular and recent discussions, in place of the plain error page.'
        list_title: Last visit and Dismiss
        sidebar_home_link_label: “Home” link
        sidebar_home_link_help: "The first link in the sidebar, as in Discourse. When it points to the discussion list, “All Discussions” starts opening the Latest list, so the two are not marked together."
        sidebar_home_label: Destination page
        sidebar_home_index: Discussion list (home page)
        sidebar_home_categories: Tags
        sidebar_home_url_option: Another address
        sidebar_title: Extra links
        sidebar_help: As in Discourse, the FAQ, terms and privacy links go into the “More” menu when they have an address. “Review” shows up by itself for moderators, with the flags queue.
        code_buttons_label: Buttons on code blocks
        code_buttons_help: "Hovering a code block shows “copy” and “full screen”, as in Discourse."
        heading_anchors_label: Link on headings
        heading_anchors_help: "Headings inside posts get the link icon (#) on hover, to point straight at that section."
        table_expand_label: Expand wide tables
        table_expand_help: "Tables that do not fit the post width get an “Expand table” button that opens them in a large window."
        spoiler_blur_label: Blurred spoilers
        spoiler_blur_help: "Spoilers (||text|| and >! at the start of the line) appear blurred until clicked, as in Discourse, instead of the dark bar."
        post_read_state_label: Reading marks
        post_read_state_help: "The “unread post” dot at the corner of each new post, which disappears as it is read, and the red “last visit” line after the last post read on the previous visit."
        post_shortcuts_label: Post shortcuts
        post_shortcuts_help: "j/k move between posts and l, b, s, e, r, q, d, ! act on the selected one; # jumps to a post; Home/End, shift+L, shift+R, shift+S, shift+P, f, m w/m r/m m and the sequences g n, g u, g b, g m, g d, g j, g k. The “?” window lists them all."
        share_networks_label: Networks
        share_networks_help: "Separated by commas, in the order they appear: x, facebook, linkedin, whatsapp, telegram, reddit, email."
        notify_post_edited_label: Notify when your post is edited
        notify_post_edited_help: "“Someone edited your post” to the author, when another person (a moderator, for example) changes the text."
        notify_topic_linked_label: Notify when your discussion is linked
        notify_topic_linked_help: "“Someone linked your discussion” when a post contains a link to a discussion of yours."
        list_last_visit_label: “Last visit” line
        list_last_visit_help: "In the Latest list, a red line separates discussions that changed since the previous visit from those that were already that way. The previous visit is kept on the reader's device."
        list_dismiss_label: “Dismiss” button
        list_dismiss_help: "In the Unread and New lists, the Discourse button that marks the discussions in the list as read (top right and at the end of the list)."
        sidebar_home_url_label: Home address
        sidebar_home_url_help: "A forum address (/p/welcome) or another site."
        sidebar_faq_url_label: FAQ / Guidelines
        sidebar_faq_url_help: Address of the frequently asked questions page or the community guidelines.
        sidebar_tos_url_label: Terms of service
        sidebar_tos_url_help: Address of the terms of service.
        sidebar_privacy_url_label: Privacy
        sidebar_privacy_url_help: Address of the privacy policy.
        sidebar_custom_title_label: Custom section title
        sidebar_custom_title_help: "The name of the links section (default: “Links”)."
        sidebar_custom_links_label: Custom section links
        sidebar_custom_links_help: "One link per line: Label | address | icon (optional, from Font Awesome). Addresses starting with / are from the forum itself. With no links, the section does not appear."
      integrations:
        solved_label: Accepted solution
        solved_help: The "✓ Solution" in the post bar and the accepted answer right below the first post, like discourse-solved.
        reactions_label: Reactions
        reactions_help: The emoji summary in the post bar, like discourse-reactions.
        polls_label: Polls
        polls_help: 'Polls with the Discourse poll grid: result bars and the big vote count beside them.'
        links_sidebar_label: Links in the sidebar
        links_sidebar_help: FoF Links leave the header and go to a sidebar section, like Discourse custom links.
        upload_progress_label: Upload progress
        upload_progress_help: The "Uploading…" bar in the composer while a FoF Upload file is sent, as in Discourse.
        profile_cover_label: Profile cover (forumaker/profile-cover)
        profile_cover_help: 'The extension''s cover instead of the theme''s own: in the profile banner, behind the user card (as the thumbnail, when there is one) and at the position chosen in its editor, which opens from the profile "…" menu and from Settings. The theme''s own images stay stored and come back if this switch is turned off.'
        thumbnails_label: Thumbnails in the list
        thumbnails_help: The FoF Discussion Thumbnail image beside the title in the discussion list, where Discourse shows its own.
      auth:
        pages_label: Full-page log in and sign up
        pages_help: The Log In and Sign Up header buttons open the /login and /signup pages, like Discourse. When off, they open the modals.
      bookmarks:
        title: Bookmarks
        bookmarks_enabled_help: Members bookmark posts to come back to later, with an optional name and reminder, and find them all in the "Bookmarks" tab of their own profile. When off, the buttons disappear and the API answers as if the feature did not exist, existing bookmarks are kept.
        bookmarks_topic_button_label: Bookmark discussion
        bookmarks_topic_button_help: Adds "Bookmark discussion" to the discussion controls (the "…" menu in the footer). It bookmarks the first post, like Discourse.
        bookmarks_user_menu_label: User menu item
        bookmarks_user_menu_help: A "Bookmarks" shortcut in the avatar menu, right below "Profile".
        reminders_notice: Reminders are sent by Flarum's scheduler every five minutes, the server must run "php flarum schedule:run" from cron every minute. Without cron, bookmarks work but no reminder is sent.
      composer:
        section_editor: Discourse composer
        enabled_help: 'The master switch: when off, the composer is plain Flarum, without any of the features below.'
        preview_label: Side-by-side preview
        preview_help: On desktop, the formatted post is shown to the right of the editor. Everyone can hide it with the « button in the editor corner.
        similar_label: Similar discussions
        similar_help: While writing a new discussion title (three words or more), shows "Your discussion is similar to…" with up to five related discussions.
        linked_topic_label: Reply as linked discussion
        linked_topic_help: In the reply composer, the "↩ ▾" menu turns the reply into a new discussion with the same text, a link back and the same tags.
        section_drafts: Drafts
        drafts_help: 'With the FoF Drafts extension, the theme shows drafts the Discourse way: new discussions and replies are saved automatically two seconds after typing stops, replying to a discussion resumes its draft, closing with text asks whether to discard or keep it, and the Start a Discussion button gets a ⌄ with the list. They are also in the user menu and in the profile Drafts tab.'
        drafts_note: Drafts are stored by fof/drafts (drafts table), which also handles permissions and scheduling. Post edits have no draft.
        section_hashtags: '#tag'
        hashtags_help: 'Typing # in the editor suggests tags and inserts a link to them; in posts, these links (and the tag mentions of the Mentions extension) become the pill with the tag symbol.'
        hashtags_mentions_notice: 'With the Mentions extension enabled, the editor # belongs to it (tag mention); the theme only draws mentions as Discourse hashtags.'
      extras:
        search_title: Search page
        search_page_enabled_help: 'Discourse’s /search page: discussion, post, tag and user tabs, advanced filters (author, primary tag, tags, title only, liked, status, dates, minimum posts) and sorting. The search modal gains an “Advanced search” link.'
        search_notice: 'The filters also become shortcuts you can type in the search: in:title, in:likes, in:bookmarks and min-posts:5, next to Flarum’s own (author:, tag:, is:locked…).'
        bulk_title: Bulk selection
        bulk_select_enabled_help: 'A button in the list bar turns on checkboxes on each discussion and an action bar: mark as read, pin, close, change tags, hide and delete. It only shows for people who can moderate some discussion in the list, and each action only applies where they have permission.'
        top_periods_title: Top by period
        top_periods_enabled_help: The Top tab shows “All time / Year / Quarter / Month / Week / Today”, limiting the list to discussions created in that range.
        text_size_title: Text size
        text_size_enabled_help: In Settings, each person picks Smaller, Normal, Larger or Largest. The choice applies to the device (it is stored in the browser), as on Discourse.
        print_title: Print discussion
        print_topic_enabled_help: Loads every post into a clean view (no sidebar, header or timeline) and opens the browser’s print dialog, which can also save as PDF.
      lucide_icons_label: Discourse icons (Lucide)
      lucide_icons_help: Interface icons (search, bell, reply, like, menus…) drawn with Lucide's thin stroke, as on meta.discourse.org. When off, the solid Font Awesome icons come back. Icons Meta does not replace (brands and some of those picked for tags and groups) stay in Font Awesome.
      stats:
        section_views: Views column highlight
        stats_views_enabled_help: The heat colors of the list's Views column (Discourse's heatmap). The number itself comes from fof/discussion-views.
        topic_views_heat_low_label: Light highlight from
        topic_views_heat_low_help: After this many views, the views field is slightly highlighted. Discourse uses 1000.
        topic_views_heat_medium_label: Moderate highlight from
        topic_views_heat_medium_help: After this many views, the views field is moderately highlighted. Discourse uses 2000.
        topic_views_heat_high_label: Strong highlight from
        topic_views_heat_high_help: After this many views, the views field is strongly highlighted. Discourse uses 3500.
        views_suffix: views
        section_counts: New and unread counts
        stats_counts_enabled_help: 'For signed-in users: "New (3)" and "Unread (2)" on the list tabs, and a dot next to All Discussions in the sidebar when there is something new.'
        stats_new_days_label: Days a discussion stays new
        stats_new_days_help: Discussions created in this period that the person has not opened yet. 0 counts everything since sign-up or the last "mark all as read". From {min} to {max}; Discourse uses 2.
        days_suffix: days
        section_activity: Profile activity
        stats_activity_enabled_help: Days visited, read time (total and last 60 days), posts read and likes given and received, in the profile summary, as in Discourse.
        activity_notice: Read time only counts while the tab is visible and someone is using the page. The numbers start from zero on the day the feature is turned on.
      section_colored: Colored highlights
      colored_accents_help: "On a tag page or in a discussion, the theme's accent colour (buttons, links, active tab, tinted background) becomes the colour of the primary tag. Elsewhere it goes back to the forum's primary colour."
      user_default_tab_label: When a profile opens
      user_default_tab_help: Which tab the profile opens on when an avatar or name is clicked.
      user_default_tab_activity: Activity (posts), as in Flarum
      user_default_tab_summary: Summary, as in Discourse
